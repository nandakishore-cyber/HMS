<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patients | HMS</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1000px; padding: 0 1rem; }
        header { align-items: center; display: flex; justify-content: space-between; }
        table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
        th, td { border-bottom: 1px solid #ddd; padding: .65rem; text-align: left; }
        a, button { cursor: pointer; }
        .toolbar { display: flex; gap: .5rem; margin-top: 1rem; }
        input, select, button { font: inherit; padding: .45rem; }
    </style>
</head>
<body>
<header>
    <h1>Patients</h1>
    <a href="patient-form.html">Register patient</a>
</header>
<div class="toolbar">
    <input id="query" placeholder="Search by name">
    <select id="status">
        <option value="">All statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="ARCHIVED">Archived</option>
    </select>
    <button onclick="loadPatients()">Search</button>
</div>
<table>
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr></thead>
    <tbody id="patients"></tbody>
</table>
<script>
    async function loadPatients() {
        const params = new URLSearchParams({size: 50});
        if (query.value) params.set('query', query.value);
        if (status.value) params.set('status', status.value);
        const response = await fetch('/api/v1/patients?' + params);
        if (!response.ok) return alert('Unable to load patients');
        const page = await response.json();
        patients.innerHTML = page.content.map(p => `<tr>
            <td>${escapeHtml(p.fullName)}</td><td>${escapeHtml(p.phone)}</td>
            <td>${escapeHtml(p.email)}</td><td>${p.status}</td>
            <td><a href="patient-details.html?id=${p.patientId}">View</a></td>
        </tr>`).join('');
    }
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }
    loadPatients();
</script>
</body>
</html>
