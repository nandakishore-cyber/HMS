spring.application.name=hms-spring

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
hms.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
hms.jwt.expiration=${JWT_EXPIRATION:PT1H}
